services:
  postgres:
    image: postgres:16-alpine
    container_name: careerpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot_password}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerpilot_user} -d ${POSTGRES_DB:-careerpilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
